[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify Secrets Scanning configuration:
  # Permitir variables públicas del cliente (Vite) para Firebase y Supabase sin bloquear el build
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_FIRESTORE_DATABASE_ID,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
